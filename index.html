<style>
:root{
  --paper:#f5f2e9; --card:#fffdf7; --ink:#1b1c20; --muted:#726c5e;
  --rule:#d9d3c2; --rule-dark:#1b1c20;
  --up:#d5342c; --up-bg:#fbeeed; --down:#1f5fc4; --down-bg:#ecf2fb;
  --accent:#8a6d1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo",serif;}
.tnum{font-variant-numeric:tabular-nums;}
.up{color:var(--up);} .down{color:var(--down);} .muted{color:var(--muted);}

/* layout */
.topbar{background:var(--ink); color:#efece2; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.topbar .brand{font-family:"Noto Serif KR",serif; font-weight:900; font-size:19px; letter-spacing:-0.5px;}
.topbar .sub{font-size:11px; color:#9a9587;}
.topbar a,.topbar button.link{color:#b8b2a2; background:none; border:none; font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
.topbar a:hover,.topbar button.link:hover{color:#fff;}
.wrap{max-width:1000px; margin:0 auto; padding:22px 16px 60px;}
.wrap.narrow{max-width:680px;}
.grid{display:grid; gap:18px;}
@media(min-width:820px){ .grid.play{grid-template-columns:3fr 2fr; align-items:start;} .grid.bots{grid-template-columns:1fr 1fr 1fr;} }

/* cards */
.card{background:var(--card); border:1px solid var(--rule); box-shadow:0 1px 0 rgba(27,28,32,.06); padding:22px;}
.card.tight{padding:16px;}

/* newspaper */
.masthead{border-bottom:4px double var(--rule-dark); padding-bottom:8px; margin-bottom:14px;}
.masthead h2{font-family:"Noto Serif KR",serif; font-weight:900; font-size:24px; letter-spacing:-1px;}
.masthead .edition{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}
.headlines{list-style:none;}
.headlines li{font-family:"Noto Serif KR",serif; font-weight:600; font-size:16.5px; line-height:1.45; padding:9px 0 9px 16px; border-left:3px solid var(--rule); margin-bottom:2px;}
.headlines li:first-child{font-size:18px; border-left-color:var(--ink);}
.tomorrow{border:1px dashed var(--muted); background:#faf7ee; padding:14px; margin-top:14px;}
.tomorrow .thead{display:flex; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:10px; font-family:"Noto Serif KR",serif; font-weight:900;}
.cutline{border-top:1px dashed var(--rule); margin:16px 0 12px; position:relative;}
.cutline span{position:absolute; top:-9px; left:0; background:var(--card); padding-right:8px; font-size:10px; color:var(--muted); letter-spacing:2px;}

/* buttons & inputs */
.btn{display:inline-block; width:100%; border:2px solid var(--ink); background:var(--ink); color:#fff; font-weight:800; font-size:15px; padding:12px; cursor:pointer; transition:.12s; text-align:center;}
.btn:hover{background:#3a3b41; border-color:#3a3b41;}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--ink); color:#fff;}
.btn.long{background:transparent; border-color:var(--up); color:var(--up);}
.btn.long.on,.btn.long:hover{background:var(--up); color:#fff;}
.btn.short{background:transparent; border-color:var(--down); color:var(--down);}
.btn.short.on,.btn.short:hover{background:var(--down); color:#fff;}
.btn.sm{padding:8px 10px; font-size:13px; width:auto;}
.textbtn{background:none; border:none; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:13px;}
.textbtn:hover{color:var(--ink);}
.textbtn.danger{color:var(--up);}
input[type=text],input[type=number],input[type=password]{
  width:100%; border:1.5px solid #a8a291; background:#fff; padding:10px 12px; font-size:15px; font-family:inherit;
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{outline:2px solid var(--ink); outline-offset:-1px;}
input[type=range]{width:100%; accent-color:var(--ink);}
input[type=file]{font-size:12px;}

/* pills, badges */
.pill{display:inline-block; font-size:11.5px; padding:3px 10px; border:1px solid var(--rule); border-radius:999px; background:#fff; color:var(--muted); margin:2px 4px 2px 0;}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid;}
.badge.novice{background:#fdf3dc; color:#8a6410; border-color:#e5c97e;}
.badge.intermediate{background:#e3f0fb; color:#1c5a9e; border-color:#9cc4e8;}
.badge.advanced{background:#efe8fb; color:#5b3aa6; border-color:#c3aef0;}

/* steps */
.step{font-size:11px; font-weight:800; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
.step b{color:var(--ink);}

/* tables */
table{width:100%; border-collapse:collapse; font-size:14px;}
th{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); text-align:left; border-bottom:2px solid var(--ink); padding:6px 4px;}
td{border-bottom:1px solid var(--rule); padding:8px 4px;}
tr.me{background:#f3efe2; font-weight:700;}
.r{text-align:right;}

/* result hero */
.hero{text-align:center; padding:34px 22px;}
.hero .label{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted);}
.hero .big{font-family:"Noto Serif KR",serif; font-weight:900; font-size:66px; line-height:1.1; letter-spacing:-2px;}
.hero .verdict{display:inline-block; margin-top:6px; font-size:13px; font-weight:800; padding:3px 14px; border-radius:999px;}
.verdict.hit{background:var(--up-bg); color:var(--up);}
.verdict.miss{background:#eee9dc; color:var(--muted);}
.verdict.hit.short{background:var(--down-bg); color:var(--down);}

/* switches (admin) */
.row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--rule);}
.row:last-child{border-bottom:none;}
.row .t{font-weight:700;}
.row .d{font-size:12.5px; color:var(--muted); margin-top:2px;}
.switch{position:relative; width:46px; height:26px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:#c9c3b2; border-radius:999px; transition:.15s; cursor:pointer;}
.switch .track:before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch input:checked + .track{background:var(--ink);}
.switch input:checked + .track:before{transform:translateX(20px);}
.subrows{margin-left:6px; padding-left:14px; border-left:2px solid var(--rule);}

h3.mini{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:22px 0 8px; font-weight:900;}
.fade{animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .fade{animation:none;} }
</style>

// Firebase: bubblelab 게임과 같은 프로젝트(bubblelab0715)의 RTDB를 그대로 사용합니다.
// (bubblelab index.html에서 복사한 실제 설정값)
const firebaseConfig = {
  apiKey: "AIzaSyDjH0oMe07iiv94pYuuAg1FOe4YwREdNAI",
  authDomain: "bubblelab0715.firebaseapp.com",
  databaseURL: "https://bubblelab0715-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bubblelab0715",
  storageBucket: "bubblelab0715.firebasestorage.app",
  messagingSenderId: "823611830309",
  appId: "1:823611830309:web:ac9cf1ad32309fc4c98fcc",
  measurementId: "G-G9NT9KHH4N"
};
const FB_PATH = "morningPaperTrader";      // rules에 추가한 경로와 일치

const ADMIN_PASSCODE = "arbitrageur";
const INDEX_NAME = "S&P 500";              // 베팅 대상 지수 (표시용)
const DB_FILES = { en: "game_database_en.json", ko: "game_database_ko.json" };

/* ================================================================
   데이터 계층: Firebase 연결 → 실패 시 데모 모드
   ================================================================ */
const fbReady = (async () => {
  try {
    if (typeof firebase === "undefined") return null;
    firebase.initializeApp(firebaseConfig);
    return firebase.database();
  } catch (e) { console.warn("Firebase init 실패 → 데모 모드", e); return null; }
})();

// 데모 모드 저장소 (localStorage 실패 시 메모리)
const _mem = {};
function lsGet(k){ try{ const v = localStorage.getItem(k); return v==null? (_mem[k]??null) : v; }catch(e){ return _mem[k]??null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} _mem[k]=v; }
const _subs = {};
function _emit(k,v){ (_subs[k]||[]).forEach(cb=>cb(v)); }

const Store = {
  on(key, cb){
    fbReady.then(db=>{
      if (db) db.ref(FB_PATH+"/"+key).on("value", s => cb(s.val()));
      else {
        (_subs[key]=_subs[key]||[]).push(cb);
        const raw = lsGet("mpt_"+key); cb(raw ? JSON.parse(raw) : null);
      }
    });
  },
  async set(key, val){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).set(val);
    lsSet("mpt_"+key, JSON.stringify(val)); _emit(key,val);
  },
  async push(key, val){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).push(val);
    const raw = lsGet("mpt_"+key); const obj = raw? JSON.parse(raw) : {};
    obj["k"+Date.now()+Math.random().toString(36).slice(2,6)] = val;
    lsSet("mpt_"+key, JSON.stringify(obj)); _emit(key,obj);
  },
  async remove(key){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).remove();
    lsSet("mpt_"+key, "null"); _emit(key,null);
  }
};
</script>

const DEFAULT_CONFIG = {
  bots:{ novice:true, intermediate:true, advanced:true },
  infoFeature:true, infoPrice:10000, revealMode:false, botsCanBuy:true,
  roundsPerSession:10
};

const START_CAPITAL = 1000000;
const KRW = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const signKRW = n => (n>=0?"+":"−") + KRW(Math.abs(n)).slice(1);
const pctf = r => (r>=0?"+":"") + (r*100).toFixed(2) + "%";
const cls = r => r>0? "up" : r<0? "down" : "muted";
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const validDb = d => Array.isArray(d) && d.length>0 && d.every(x=>x && x.headlines && typeof x.kospi_return==="number" && x.bots && x.next_day_noisy && x.next_day_reveal);

async function fetchDb(lang){
  try{
    const r = await fetch(DB_FILES[lang], {cache:"no-store"});
    if(!r.ok) return null;
    const d = await r.json();
    return validDb(d) ? d : null;
  }catch(e){ return null; }
}

function App(){
  const [lang, setLang] = useState(lsGet("mpt_lang") || "en");
  const t = STR[lang];
  const [view, setView] = useState(location.hash==="#admin" ? "adminLogin" : "lobby");
  const [conn, setConn] = useState("checking");   // checking | online | demo
  const [cfg, setCfg] = useState(DEFAULT_CONFIG);
  const [dbs, setDbs] = useState({en:null, ko:null});
  const [lb, setLb] = useState([]);
  const [name, setName] = useState("");
  const [adminOk, setAdminOk] = useState(false);

  // 세션 상태
  const [sc, setSc] = useState(DEFAULT_CONFIG);
  const [days, setDays] = useState([]);
  const [i, setI] = useState(0);
  const [cap, setCap] = useState(START_CAPITAL);
  const [botCaps, setBotCaps] = useState({});
  const [bought, setBought] = useState(false);
  const [dir, setDir] = useState(null);
  const [size, setSize] = useState(50);
  const [res, setRes] = useState(null);
  const [nRounds, setNRounds] = useState(0);
  const [savedMsg, setSavedMsg] = useState("");

  const loadFiles = () => { ["en","ko"].forEach(async L => {
    const d = await fetchDb(L); setDbs(prev => ({...prev, [L]: d}));
  }); };

  useEffect(()=>{
    fbReady.then(db => setConn(db ? "online" : "demo"));
    Store.on("config", v => { if(v) setCfg({...DEFAULT_CONFIG, ...v, bots:{...DEFAULT_CONFIG.bots, ...(v.bots||{})}}); });
    Store.on("leaderboard", v => {
      const arr = v ? Object.values(v) : [];
      arr.sort((a,b)=>b.capital-a.capital);
      setLb(arr.slice(0,100));
    });
    loadFiles();
  },[]);

  const pickLang = L => { setLang(L); lsSet("mpt_lang", L); };
  const db = dbs[lang] || SAMPLE_DB;
  const activeBots = useMemo(()=>Object.keys(BOT_META).filter(b=>cfg.bots[b]), [cfg]);
  const day = days[i];
  const bName = b => BOT_META[b].name[lang];
  const dirLabel = d => d===1? t.dirLong : d===-1? t.dirShort : t.dirPass;

  /* ---------- 진행 ---------- */
  function start(){
    if(!name.trim()) return;
    const snapshot = JSON.parse(JSON.stringify(cfg));
    const n = Math.max(1, Math.min(snapshot.roundsPerSession, db.length));
    setSc(snapshot);
    setDays(shuffle(db).slice(0, n));
    setI(0); setCap(START_CAPITAL); setNRounds(0);
    const bc={}; Object.keys(BOT_META).filter(b=>snapshot.bots[b]).forEach(b=>bc[b]=START_CAPITAL);
    setBotCaps(bc);
    setBought(false); setDir(null); setSize(50); setRes(null);
    setView("play");
  }

  function buyInfo(){
    if(bought || cap < sc.infoPrice) return;
    setCap(c => c - sc.infoPrice);
    setBought(true);
  }

  function settle(pDir, pSize){
    const r = day.kospi_return;
    const bet = cap * pSize/100;
    const pnl = pDir * bet * r;
    const newCap = cap + pnl;

    const bres = {}; const nb = {...botCaps};
    Object.keys(nb).forEach(b=>{
      const bd = day.bots[b];
      const buys = sc.infoFeature && sc.botsCanBuy && bd.informed.buy && nb[b] > sc.infoPrice;
      const d = buys ? bd.informed : bd.base;
      const fee = buys ? sc.infoPrice : 0;
      const bbet = (nb[b]-fee) * d.size/100;
      const bpnl = d.dir * bbet * r - fee;
      nb[b] += bpnl;
      bres[b] = { dir:d.dir, size:d.size, rationale:d.rationale, buys, pnl:bpnl, cap:nb[b] };
    });

    setBotCaps(nb); setCap(newCap); setNRounds(n=>n+1);
    setRes({ r, pDir, pSize, bet, pnl, fee: bought? sc.infoPrice:0, bres });
    setView("result");
  }

  function next(){
    if(i+1 >= days.length || cap <= 0){ finish(); return; }
    setI(x=>x+1); setBought(false); setDir(null); setSize(50); setRes(null);
    setView("play");
  }

  function finish(){
    if(name.trim() && nRounds>0){
      Store.push("leaderboard", { name:name.trim().slice(0,20), capital:Math.round(cap),
        ret:(cap-START_CAPITAL)/START_CAPITAL, rounds:nRounds, lang, ts:Date.now() });
    }
    setView("final");
  }

  function saveCfg(nextCfg){
    setCfg(nextCfg); Store.set("config", nextCfg);
    setSavedMsg(t.saved); setTimeout(()=>setSavedMsg(""), 1500);
  }

  /* ---------- 공용 부품 ---------- */
  const Headlines = ({items}) => <ol className="headlines">{items.map((h,k)=><li key={k}>{h}</li>)}</ol>;

  const Leaderboard = ({rows, limit}) => rows.length===0 ? <p className="muted" style={{fontSize:13}}>{t.lbEmpty}</p> :
    <table><thead><tr><th style={{width:36}}>#</th><th>{t.thPlayer}</th><th className="r">{t.thCap}</th><th className="r">{t.thRet}</th></tr></thead>
      <tbody>{rows.slice(0,limit).map((e,k)=>
        <tr key={k} className={e.name===name.trim()? "me":""}>
          <td className="tnum muted">{k+1}</td><td>{e.name}</td>
          <td className={"r tnum "+(e.capital>=START_CAPITAL?"up":"down")}><b>{KRW(e.capital)}</b></td>
          <td className={"r tnum "+cls(e.ret)}>{pctf(e.ret||0)}</td>
        </tr>)}
      </tbody></table>;

  const LangSwitch = () =>
    <span style={{display:"inline-flex", gap:2}}>
      <button className="link" style={{fontWeight:lang==="en"?800:400, color:lang==="en"?"#fff":undefined}} onClick={()=>pickLang("en")}>EN</button>
      <span style={{color:"#6a655a"}}>|</span>
      <button className="link" style={{fontWeight:lang==="ko"?800:400, color:lang==="ko"?"#fff":undefined}} onClick={()=>pickLang("ko")}>한국어</button>
    </span>;

  const TopBar = () =>
    <div className="topbar">
      <div>
        <span className="brand">{t.brand}</span>
        <span className="sub" style={{marginLeft:10}}>{t.tagline}</span>
      </div>
      <div style={{display:"flex", alignItems:"center", gap:14}}>
        <LangSwitch/>
        {(view==="play"||view==="result") &&
          <span className="tnum" style={{fontSize:13}}>{name} · <b style={{color:cap>=START_CAPITAL?"#ff8a80":"#9dc1ff"}}>{KRW(cap)}</b></span>}
        {view.startsWith("admin")
          ? <button className="link" onClick={()=>setView("lobby")}>{t.toStudent}</button>
          : <button className="link" onClick={()=>setView(adminOk?"admin":"adminLogin")}>{t.admin}</button>}
      </div>
    </div>;

  const DemoBanner = () => conn==="demo" &&
    <div className="notice" style={{maxWidth:1000, margin:"14px auto 0"}}>
      <b>{t.demoBanner[0]}</b> {t.demoBanner[1]}
    </div>;

  /* ================= 화면 ================= */

  if(view==="lobby") return <div><TopBar/><DemoBanner/>
    <div className="wrap narrow fade">
      <div className="card">
        <h1 className="serif" style={{fontSize:30, fontWeight:900, lineHeight:1.25, letterSpacing:"-1px"}}>
          {t.lobbyTitle1}<br/>{t.lobbyTitle2}
        </h1>
        <p className="muted" style={{marginTop:12, fontSize:14}}>{t.lobbyIntro}</p>
        <div className="kv">
          <div className="box"><div className="k">{t.kvCapital}</div><div className="v tnum">{KRW(START_CAPITAL)}</div></div>
          <div className="box"><div className="k">{t.kvRounds}</div><div className="v">{t.kvRoundsVal(Math.min(cfg.roundsPerSession, db.length))}</div></div>
          <div className="box"><div className="k">{t.kvInfo}</div><div className="v">{cfg.infoFeature? t.kvInfoOn(KRW(cfg.infoPrice)) : t.kvInfoOff}</div></div>
          <div className="box"><div className="k">{t.kvBots}</div><div className="v">{activeBots.length? activeBots.map(bName).join(" · ") : t.kvBotsNone}</div></div>
        </div>
        <div style={{display:"flex", gap:8}}>
          <input type="text" placeholder={t.namePh} value={name} maxLength={20}
            onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&start()} />
          <button className="btn" style={{width:"auto", padding:"12px 26px"}} disabled={!name.trim() || conn==="checking"} onClick={start}>
            {conn==="checking"? t.connecting : t.start}
          </button>
        </div>
        <details style={{marginTop:16, fontSize:13.5}}>
          <summary style={{cursor:"pointer", fontWeight:700}}>{t.howto}</summary>
          <ol style={{margin:"10px 0 0 18px", color:"var(--muted)"}}>
            <li>{t.howto1([t.long, t.short])}</li>
            <li>{t.howto2}</li>
            {cfg.infoFeature && <li>{t.howto3(KRW(cfg.infoPrice))}</li>}
            <li>{t.howto4}</li>
          </ol>
        </details>
        <h3 className="mini">{t.lb}</h3>
        <Leaderboard rows={lb} limit={5} />
        <p className="footer-note">{t.disclaimer}</p>
      </div>
    </div></div>;

  if(view==="adminLogin") return <div><TopBar/>
    <div className="modal-bg" onClick={()=>setView("lobby")}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h3 className="serif" style={{fontWeight:900, fontSize:20, marginBottom:12}}>{t.loginTitle}</h3>
        <input type="password" placeholder={t.pw} autoFocus
          onKeyDown={e=>{ if(e.key==="Enter"){ if(e.target.value===ADMIN_PASSCODE){ setAdminOk(true); setView("admin"); } else alert(t.pwWrong); } }} />
        <p className="footer-note">{t.pwHint}</p>
        <button className="textbtn" style={{marginTop:8}} onClick={()=>setView("lobby")}>{t.back}</button>
      </div>
    </div></div>;

  if(view==="admin"){
    const Row = ({tt,d,children}) => <div className="row"><div><div className="t">{tt}</div>{d&&<div className="d">{d}</div>}</div>{children}</div>;
    const Switch = ({on,set}) => <label className="switch"><input type="checkbox" checked={on} onChange={e=>set(e.target.checked)} /><span className="track"></span></label>;
    return <div><TopBar/><DemoBanner/>
      <div className="wrap fade" style={{maxWidth:760}}>
        <div className="admin-h">
          <h1>{lang==="ko"?"편집국":"Newsroom"} <span className="muted" style={{fontSize:14, fontWeight:400}}>{t.admin}</span></h1>
          <span className="saveflash">{savedMsg || (conn==="demo"? t.demoTag : t.online)}</span>
        </div>
        <p className="muted" style={{fontSize:13, marginBottom:16}}>{t.adminNote}</p>

        <div className="card tight" style={{marginBottom:16}}>
          <p className="section-t">{t.s1}</p>
          {Object.keys(BOT_META).map(b=>
            <Row key={b} tt={<span className={"badge "+BOT_META[b].cls}>{bName(b)}</span>} d={BOT_META[b].desc[lang]}>
              <Switch on={cfg.bots[b]} set={v=>saveCfg({...cfg, bots:{...cfg.bots,[b]:v}})} />
            </Row>)}
        </div>

        <div className="card tight" style={{marginBottom:16}}>
          <p className="section-t">{t.s2} <span style={{textTransform:"none", letterSpacing:0}}>{t.s2b}</span></p>
          <Row tt={t.rInfo} d={t.rInfoD}>
            <Switch on={cfg.infoFeature} set={v=>saveCfg({...cfg, infoFeature:v})} />
          </Row>
          {cfg.infoFeature && <div className="subrows">
            <Row tt={t.rPrice} d={t.rPriceD}>
              <input type="number" step="1000" min="0" style={{width:120, textAlign:"right"}} value={cfg.infoPrice}
                onChange={e=>saveCfg({...cfg, infoPrice:Math.max(0, +e.target.value||0)})} />
            </Row>
            <Row tt={t.rReveal} d={t.rRevealD}>
              <Switch on={cfg.revealMode} set={v=>saveCfg({...cfg, revealMode:v})} />
            </Row>
            <Row tt={t.rBotsBuy} d={t.rBotsBuyD}>
              <Switch on={cfg.botsCanBuy} set={v=>saveCfg({...cfg, botsCanBuy:v})} />
            </Row>
          </div>}
        </div>

        <div className="card tight" style={{marginBottom:16}}>
          <p className="section-t">{t.s3}</p>
          <Row tt={t.rRounds} d={t.rRoundsD(db.length)}>
            <input type="number" min="1" max="50" style={{width:90, textAlign:"right"}} value={cfg.roundsPerSession}
              onChange={e=>saveCfg({...cfg, roundsPerSession:Math.max(1, Math.min(50, +e.target.value||1))})} />
          </Row>
        </div>

        <div className="card tight" style={{marginBottom:16}}>
          <p className="section-t">{t.s4}</p>
          <Row tt={<span>EN — {dbs.en? t.dataLoaded(dbs.en.length) : t.dataMissing}</span>} d={DB_FILES.en}></Row>
          <Row tt={<span>KO — {dbs.ko? t.dataLoaded(dbs.ko.length) : t.dataMissing}</span>} d={DB_FILES.ko}></Row>
          <div style={{paddingTop:10, display:"flex", gap:14, alignItems:"center"}}>
            <button className="btn sm ghost" onClick={loadFiles}>{t.reload}</button>
            <span className="muted" style={{fontSize:12}}>{t.dataD}</span>
          </div>
        </div>

        <div className="card tight">
          <p className="section-t">{t.s5} <span style={{textTransform:"none", letterSpacing:0}}>({lb.length})</span></p>
          <div style={{maxHeight:300, overflowY:"auto", marginTop:6}}><Leaderboard rows={lb} limit={100} /></div>
          <div style={{marginTop:12}}>
            <button className="textbtn danger" onClick={()=>{ if(confirm(t.lbResetC)) Store.remove("leaderboard"); }}>{t.lbReset}</button>
          </div>
        </div>
      </div></div>;
  }

  if(view==="play" && day) return <div><TopBar/>
    <div className="wrap fade">
      <div className="grid play">
        <div className="card">
          <div className="masthead">
            <div className="edition"><span>{t.edition}</span><span>{t.dateHidden}</span></div>
            <h2>{t.masthead}</h2>
            <div style={{fontSize:11.5, color:"var(--muted)"}}>{t.mastheadSub}</div>
          </div>
          <Headlines items={day.headlines} />
          {sc.infoFeature && <div>
            <div className="cutline"><span>{t.infoCut}</span></div>
            {!bought
              ? <div>
                  <button className="btn ghost" disabled={cap < sc.infoPrice} onClick={buyInfo}>{t.buyInfo(KRW(sc.infoPrice))}</button>
                  <p className="footer-note">{t.feeNote}</p>
                </div>
              : <div className="tomorrow">
                  <div className="thead">
                    <span>{t.tomorrow} <span className="muted" style={{fontWeight:400, fontSize:11}}>{sc.revealMode? t.revealTag : t.noisyTag}</span></span>
                    <span className="up" style={{fontSize:12, fontWeight:800}}>{t.paid(KRW(sc.infoPrice))}</span>
                  </div>
                  <Headlines items={sc.revealMode? day.next_day_reveal : day.next_day_noisy} />
                </div>}
          </div>}
        </div>

        <div style={{display:"grid", gap:14}}>
          <div className="card">
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:14}}>
              <span className="progress">{t.round} {i+1} / {days.length}</span>
              <span className="progress tnum">{t.capitalAvail} {KRW(cap)}</span>
            </div>
            <p className="step"><b>{t.step1}</b></p>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:16}}>
              <button className={"btn long"+(dir===1?" on":"")} onClick={()=>setDir(1)}>{t.long}</button>
              <button className={"btn short"+(dir===-1?" on":"")} onClick={()=>setDir(-1)}>{t.short}</button>
            </div>
            <p className="step"><b>{t.step2}</b> — <span className="tnum" style={{color:"var(--ink)"}}>{size}% = {KRW(cap*size/100)}</span></p>
            <input type="range" min="0" max="100" step="5" value={size} onChange={e=>setSize(+e.target.value)} />
            <div style={{display:"flex", justifyContent:"space-between", fontSize:10, color:"var(--muted)", marginBottom:16}}>
              <span>0%</span><span>50%</span><span>100%</span>
            </div>
            <p className="step"><b>{t.step3}</b></p>
            <button className="btn" disabled={!dir || size===0} onClick={()=>settle(dir,size)}>{t.submit}</button>
            <div style={{textAlign:"center", marginTop:10}}>
              <button className="textbtn" onClick={()=>settle(0,0)}>{t.pass}</button>
            </div>
          </div>
          {Object.keys(botCaps).length>0 && <div className="card tight" style={{fontSize:12.5, color:"var(--muted)"}}>
            <b style={{color:"var(--ink)"}}>{t.aiBox}</b> — {t.aiBoxD}
            <div style={{marginTop:8}}>
              {Object.keys(botCaps).map(b=><span key={b} className="pill"><span className={"badge "+BOT_META[b].cls} style={{marginRight:6}}>{bName(b)}</span><span className="tnum">{KRW(botCaps[b])}</span></span>)}
            </div>
            {t.aiLangNote && <div style={{marginTop:6, fontSize:11}}>{t.aiLangNote}</div>}
          </div>}
        </div>
      </div>
    </div></div>;

  if(view==="result" && res && day){
    const hit = res.pDir!==0 && res.pDir*res.r>0;
    return <div><TopBar/>
      <div className="wrap fade">
        <div className="card hero">
          <div className="label">{t.resultLabel}</div>
          <div className={"big "+cls(res.r)}>{pctf(res.r)}</div>
          {res.pDir!==0
            ? <div className={"verdict "+(hit? "hit"+(res.pDir===-1?" short":"") : "miss")}>{hit? t.hit : t.miss}</div>
            : <div className="verdict miss">{t.sat}</div>}
          <div style={{marginTop:14, fontSize:14}}>
            {t.myChoice}: <b>{dirLabel(res.pDir)}</b>{res.pDir!==0 && <> · {res.pSize}% ({KRW(res.bet)})</>}{res.fee>0 && <> · {t.infoFee} {KRW(res.fee)}</>}
          </div>
          <div className={"tnum "+cls(res.pnl - 0.000001)} style={{fontSize:26, fontWeight:900, marginTop:2}}>{signKRW(res.pnl)}</div>
          <div className="muted tnum" style={{fontSize:13}}>{t.balance} {KRW(cap)}</div>
        </div>

        {Object.keys(res.bres).length>0 && <div className="grid bots" style={{marginTop:16}}>
          {Object.keys(res.bres).map(b=>{ const x=res.bres[b]; return (
            <div key={b} className="card tight">
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                <span className={"badge "+BOT_META[b].cls}>{bName(b)}</span>
                <b className={"tnum "+cls(x.pnl-0.000001)}>{signKRW(x.pnl)}</b>
              </div>
              <div style={{fontWeight:800, fontSize:14}}>{dirLabel(x.dir)}{x.dir!==0 && ` · ${x.size}%`}{x.buys && <span style={{marginLeft:6, fontWeight:600, fontSize:11.5, color:"#5b3aa6"}}>{t.infoBadge}</span>}</div>
              <p className="muted" style={{fontSize:12.5, marginTop:6}}>“{x.rationale}”</p>
              <div className="muted tnum" style={{fontSize:11.5, marginTop:8}}>{t.balance} {KRW(x.cap)}</div>
            </div>);})}
        </div>}

        <button className="btn" style={{marginTop:18}} onClick={next}>
          {(i+1>=days.length || cap<=0)? t.finalBtn : t.next}
        </button>
      </div></div>;
  }

  if(view==="final"){
    const rows = [{name:name.trim()+" "+t.me, cap}, ...Object.keys(botCaps).map(b=>({name:bName(b), cap:botCaps[b]}))]
      .sort((a,b)=>b.cap-a.cap);
    return <div><TopBar/>
      <div className="wrap narrow fade">
        <div className="card">
          <h2 className="serif" style={{fontSize:24, fontWeight:900, marginBottom:4}}>{t.finalTitle}</h2>
          <p className="muted" style={{fontSize:13, marginBottom:14}}>{cap<=0? t.busted : t.completed(nRounds)}</p>
          <table>
            <thead><tr><th>{t.thRank}</th><th>{t.thPlayer}</th><th className="r">{t.thCap}</th><th className="r">{t.thRet}</th></tr></thead>
            <tbody>{rows.map((e,k)=>
              <tr key={k} className={e.name.endsWith(t.me)? "me":""}>
                <td className="tnum">{k+1}</td><td>{e.name}</td>
                <td className="r tnum"><b>{KRW(e.cap)}</b></td>
                <td className={"r tnum "+cls(e.cap-START_CAPITAL)}>{pctf((e.cap-START_CAPITAL)/START_CAPITAL)}</td>
              </tr>)}
            </tbody>
          </table>
          <p className="footer-note">{conn==="demo"? t.lbNoteDemo : t.lbNoteOn}</p>
          <h3 className="mini">{t.fullLb}</h3>
          <Leaderboard rows={lb} limit={15} />
          <button className="btn" style={{marginTop:18}} onClick={()=>setView("lobby")}>{t.again}</button>
        </div>
      </div></div>;
  }

  return <div><TopBar/><div className="wrap"><p className="muted">{t.connecting}</p></div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
