<style>
:root{
  --paper:#f5f2e9; --card:#fffdf7; --ink:#1b1c20; --muted:#726c5e;
  --rule:#d9d3c2; --rule-dark:#1b1c20;
  --up:#d5342c; --up-bg:#fbeeed; --down:#1f5fc4; --down-bg:#ecf2fb;
  --accent:#8a6d1f;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo",serif;}
.tnum{font-variant-numeric:tabular-nums;}
.up{color:var(--up);} .down{color:var(--down);} .muted{color:var(--muted);}

/* layout */
.topbar{background:var(--ink); color:#efece2; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
.topbar .brand{font-family:"Noto Serif KR",serif; font-weight:900; font-size:19px; letter-spacing:-0.5px;}
.topbar .sub{font-size:11px; color:#9a9587;}
.topbar a,.topbar button.link{color:#b8b2a2; background:none; border:none; font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
.topbar a:hover,.topbar button.link:hover{color:#fff;}
.wrap{max-width:1000px; margin:0 auto; padding:22px 16px 60px;}
.wrap.narrow{max-width:680px;}
.grid{display:grid; gap:18px;}
@media(min-width:820px){ .grid.play{grid-template-columns:3fr 2fr; align-items:start;} .grid.bots{grid-template-columns:1fr 1fr 1fr;} }

/* cards */
.card{background:var(--card); border:1px solid var(--rule); box-shadow:0 1px 0 rgba(27,28,32,.06); padding:22px;}
.card.tight{padding:16px;}

/* newspaper */
.masthead{border-bottom:4px double var(--rule-dark); padding-bottom:8px; margin-bottom:14px;}
.masthead h2{font-family:"Noto Serif KR",serif; font-weight:900; font-size:24px; letter-spacing:-1px;}
.masthead .edition{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}
.headlines{list-style:none;}
.headlines li{font-family:"Noto Serif KR",serif; font-weight:600; font-size:16.5px; line-height:1.45; padding:9px 0 9px 16px; border-left:3px solid var(--rule); margin-bottom:2px;}
.headlines li:first-child{font-size:18px; border-left-color:var(--ink);}
.tomorrow{border:1px dashed var(--muted); background:#faf7ee; padding:14px; margin-top:14px;}
.tomorrow .thead{display:flex; justify-content:space-between; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-bottom:10px; font-family:"Noto Serif KR",serif; font-weight:900;}
.cutline{border-top:1px dashed var(--rule); margin:16px 0 12px; position:relative;}
.cutline span{position:absolute; top:-9px; left:0; background:var(--card); padding-right:8px; font-size:10px; color:var(--muted); letter-spacing:2px;}

/* buttons & inputs */
.btn{display:inline-block; width:100%; border:2px solid var(--ink); background:var(--ink); color:#fff; font-weight:800; font-size:15px; padding:12px; cursor:pointer; transition:.12s; text-align:center;}
.btn:hover{background:#3a3b41; border-color:#3a3b41;}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn.ghost{background:transparent; color:var(--ink);}
.btn.ghost:hover{background:var(--ink); color:#fff;}
.btn.long{background:transparent; border-color:var(--up); color:var(--up);}
.btn.long.on,.btn.long:hover{background:var(--up); color:#fff;}
.btn.short{background:transparent; border-color:var(--down); color:var(--down);}
.btn.short.on,.btn.short:hover{background:var(--down); color:#fff;}
.btn.sm{padding:8px 10px; font-size:13px; width:auto;}
.textbtn{background:none; border:none; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:13px;}
.textbtn:hover{color:var(--ink);}
.textbtn.danger{color:var(--up);}
input[type=text],input[type=number],input[type=password]{
  width:100%; border:1.5px solid #a8a291; background:#fff; padding:10px 12px; font-size:15px; font-family:inherit;
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus{outline:2px solid var(--ink); outline-offset:-1px;}
input[type=range]{width:100%; accent-color:var(--ink);}
input[type=file]{font-size:12px;}

/* pills, badges */
.pill{display:inline-block; font-size:11.5px; padding:3px 10px; border:1px solid var(--rule); border-radius:999px; background:#fff; color:var(--muted); margin:2px 4px 2px 0;}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; border:1px solid;}
.badge.novice{background:#fdf3dc; color:#8a6410; border-color:#e5c97e;}
.badge.intermediate{background:#e3f0fb; color:#1c5a9e; border-color:#9cc4e8;}
.badge.advanced{background:#efe8fb; color:#5b3aa6; border-color:#c3aef0;}

/* steps */
.step{font-size:11px; font-weight:800; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:6px;}
.step b{color:var(--ink);}

/* tables */
table{width:100%; border-collapse:collapse; font-size:14px;}
th{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); text-align:left; border-bottom:2px solid var(--ink); padding:6px 4px;}
td{border-bottom:1px solid var(--rule); padding:8px 4px;}
tr.me{background:#f3efe2; font-weight:700;}
.r{text-align:right;}

/* result hero */
.hero{text-align:center; padding:34px 22px;}
.hero .label{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted);}
.hero .big{font-family:"Noto Serif KR",serif; font-weight:900; font-size:66px; line-height:1.1; letter-spacing:-2px;}
.hero .verdict{display:inline-block; margin-top:6px; font-size:13px; font-weight:800; padding:3px 14px; border-radius:999px;}
.verdict.hit{background:var(--up-bg); color:var(--up);}
.verdict.miss{background:#eee9dc; color:var(--muted);}
.verdict.hit.short{background:var(--down-bg); color:var(--down);}

/* switches (admin) */
.row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--rule);}
.row:last-child{border-bottom:none;}
.row .t{font-weight:700;}
.row .d{font-size:12.5px; color:var(--muted); margin-top:2px;}
.switch{position:relative; width:46px; height:26px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:#c9c3b2; border-radius:999px; transition:.15s; cursor:pointer;}
.switch .track:before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);}
.switch input:checked + .track{background:var(--ink);}
.switch input:checked + .track:before{transform:translateX(20px);}
.subrows{margin-left:6px; padding-left:14px; border-left:2px solid var(--rule);}

h3.mini{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:22px 0 8px; font-weight:900;}
.fade{animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){ .fade{animation:none;} }
</style>

// Firebase: bubblelab 게임과 같은 프로젝트(bubblelab0715)의 RTDB를 그대로 사용합니다.
// (bubblelab index.html에서 복사한 실제 설정값)
const firebaseConfig = {
  apiKey: "AIzaSyDjH0oMe07iiv94pYuuAg1FOe4YwREdNAI",
  authDomain: "bubblelab0715.firebaseapp.com",
  databaseURL: "https://bubblelab0715-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bubblelab0715",
  storageBucket: "bubblelab0715.firebasestorage.app",
  messagingSenderId: "823611830309",
  appId: "1:823611830309:web:ac9cf1ad32309fc4c98fcc",
  measurementId: "G-G9NT9KHH4N"
};
const FB_PATH = "morningPaperTrader";      // rules에 추가한 경로와 일치

const ADMIN_PASSCODE = "arbitrageur";
const INDEX_NAME = "S&P 500";              // 베팅 대상 지수 (표시용)
const DB_FILES = { en: "game_database_en.json", ko: "game_database_ko.json" };

/* ================================================================
   데이터 계층: Firebase 연결 → 실패 시 데모 모드
   ================================================================ */
const fbReady = (async () => {
  try {
    if (typeof firebase === "undefined") return null;
    firebase.initializeApp(firebaseConfig);
    return firebase.database();
  } catch (e) { console.warn("Firebase init 실패 → 데모 모드", e); return null; }
})();

// 데모 모드 저장소 (localStorage 실패 시 메모리)
const _mem = {};
function lsGet(k){ try{ const v = localStorage.getItem(k); return v==null? (_mem[k]??null) : v; }catch(e){ return _mem[k]??null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} _mem[k]=v; }
const _subs = {};
function _emit(k,v){ (_subs[k]||[]).forEach(cb=>cb(v)); }

const Store = {
  on(key, cb){
    fbReady.then(db=>{
      if (db) db.ref(FB_PATH+"/"+key).on("value", s => cb(s.val()));
      else {
        (_subs[key]=_subs[key]||[]).push(cb);
        const raw = lsGet("mpt_"+key); cb(raw ? JSON.parse(raw) : null);
      }
    });
  },
  async set(key, val){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).set(val);
    lsSet("mpt_"+key, JSON.stringify(val)); _emit(key,val);
  },
  async push(key, val){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).push(val);
    const raw = lsGet("mpt_"+key); const obj = raw? JSON.parse(raw) : {};
    obj["k"+Date.now()+Math.random().toString(36).slice(2,6)] = val;
    lsSet("mpt_"+key, JSON.stringify(obj)); _emit(key,obj);
  },
  async remove(key){
    const db = await fbReady;
    if (db) return db.ref(FB_PATH+"/"+key).remove();
    lsSet("mpt_"+key, "null"); _emit(key,null);
  }
};
</script>

const DEFAULT_CONFIG = {
  bots:{ novice:true, intermediate:true, advanced:true },
  infoFeature:true, infoPrice:10000, revealMode:false, botsCanBuy:true,
  roundsPerSession:10, turnSeconds:60, revealSeconds:5, showGap:true
};

const START_CAPITAL = 1000000;
const RUIN_FLOOR = 10000;               // 자본이 이 밑으로 떨어지면 파산(탈락)
const MAX_POS = 500;                    // 포지션 한도 ±500% (5x)
const VAR95 = 0.0183;                   // 데이터셋의 |시가→종가| 일간 변동 95퍼센타일
const KRW = n => "₩" + Math.round(n).toLocaleString("ko-KR");
const signKRW = n => (n>=0?"+":"−") + KRW(Math.abs(n)).slice(1);
const pctf = r => (r>=0?"+":"") + (r*100).toFixed(2) + "%";
const cls = r => r>0? "up" : r<0? "down" : "muted";
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const validDb = d => Array.isArray(d) && d.length>0 && d.every(x=>x && x.headlines && typeof x.kospi_return==="number" && x.bots && x.next_day_noisy && x.next_day_reveal);
const mmss = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

async function fetchDb(lang){
  try{
    const r = await fetch(DB_FILES[lang], {cache:"no-store"});
    if(!r.ok) return null;
    const d = await r.json();
    return validDb(d) ? d : null;
  }catch(e){ return null; }
}

function App(){
  const [lang, setLang] = useState(lsGet("mpt_lang") || "en");
  const t = STR[lang];
  const [view, setView] = useState(location.hash==="#admin" ? "adminLogin" : "lobby"); // lobby | class | solo screens | admin*
  const [conn, setConn] = useState("checking");
  const [cfg, setCfg] = useState(DEFAULT_CONFIG);
  const [dbs, setDbs] = useState({en:null, ko:null});
  const [lb, setLb] = useState([]);
  const [name, setName] = useState(lsGet("mpt_name") || "");
  const [adminOk, setAdminOk] = useState(false);
  const [offset, setOffset] = useState(0);
  const [, setTick] = useState(0);
  const now = () => Date.now() + offset;

  // ---- class (shared room) state ----
  const [pid] = useState(()=>{ let p = lsGet("mpt_pid"); if(!p){ p = "p"+Math.random().toString(36).slice(2,10); lsSet("mpt_pid", p); } return p; });
  const [RS, setRS] = useState(null);          // room/state
  const [RP, setRP] = useState({});            // room/players
  const [RB, setRB] = useState({});            // room/bets
  const [RR, setRR] = useState({});            // room/results
  const [myBet, setMyBet] = useState({pos:0, bought:false});
  const settlingRef = useRef(false);
  const allInRef = useRef(null);
  const advRef = useRef(false);

  // ---- solo state ----
  const [sc, setSc] = useState(DEFAULT_CONFIG);
  const [days, setDays] = useState([]);
  const [i, setI] = useState(0);
  const [cap, setCap] = useState(START_CAPITAL);
  const [botCaps, setBotCaps] = useState({});
  const [bought, setBought] = useState(false);
  const [pos, setPos] = useState(0);
  const [res, setRes] = useState(null);
  const [nRounds, setNRounds] = useState(0);
  const [savedMsg, setSavedMsg] = useState("");

  const loadFiles = () => { ["en","ko"].forEach(async L => {
    const d = await fetchDb(L); setDbs(prev => ({...prev, [L]: d}));
  }); };

  useEffect(()=>{
    fbReady.then(db => {
      setConn(db ? "online" : "demo");
      if (db) db.ref(".info/serverTimeOffset").on("value", s => setOffset(s.val()||0));
    });
    Store.on("config", v => { if(v) setCfg({...DEFAULT_CONFIG, ...v, bots:{...DEFAULT_CONFIG.bots, ...(v.bots||{})}}); });
    Store.on("leaderboard", v => {
      const arr = v ? Object.values(v) : [];
      arr.sort((a,b)=>b.capital-a.capital);
      setLb(arr.slice(0,100));
    });
    Store.on("room/state", v => setRS(v));
    Store.on("room/players", v => setRP(v||{}));
    Store.on("room/bets", v => setRB(v||{}));
    Store.on("room/results", v => setRR(v||{}));
    loadFiles();
    const iv = setInterval(()=>setTick(x=>x+1), 400);
    return ()=>clearInterval(iv);
  },[]);

  // restore my bet on round change / refresh
  useEffect(()=>{
    if(!RS) return;
    const mine = (RB[RS.round]||{})[pid];
    setMyBet(mine ? {pos:(mine.pos!=null? mine.pos : (mine.dir||0)*(mine.size||0)), bought:!!mine.bought}
                  : {pos:0, bought:false});
  }, [RS && RS.round, RS && RS.phase==="betting"]);

  const pickLang = L => { setLang(L); lsSet("mpt_lang", L); };
  const activeBots = useMemo(()=>Object.keys(BOT_META).filter(b=>cfg.bots[b]), [cfg]);
  const usingSample = !dbs.en && !dbs.ko;
  const anyDb = dbs.en || dbs.ko || SAMPLE_DB;
  const bName = b => BOT_META[b].name[lang];
  const dirLabel = d => d===1? t.dirLong : d===-1? t.dirShort : t.dirPass;

  // headline lookup by id, preferring the viewer's language
  const maps = useMemo(()=>{
    const m = {};
    for(const [L, d] of Object.entries({en:dbs.en, ko:dbs.ko, sample:SAMPLE_DB}))
      if(d) { m[L] = {}; d.forEach(x=>m[L][x.id]=x); }
    return m;
  }, [dbs]);
  const dayById = id => (maps[lang]&&maps[lang][id]) || (maps[lang==="en"?"ko":"en"]&&maps[lang==="en"?"ko":"en"][id]) || maps.sample[id];

  /* ================= CLASS GAME (shared) ================= */

  function joinClass(){
    if(!name.trim() || conn!=="online") return;
    lsSet("mpt_name", name.trim());
    const existing = RP[pid];
    const inLobby = !RS || RS.phase==="lobby" || RS.phase==="finished" || !RS.phase;
    if(existing){
      Store.set(`room/players/${pid}/name`, name.trim().slice(0,20));
      Store.set(`room/players/${pid}/lang`, lang);
    } else {
      Store.set(`room/players/${pid}`, { name:name.trim().slice(0,20), lang, joinedAt:Date.now(),
        capital:START_CAPITAL, playing: inLobby });
    }
    setView("class");
  }
  function leaveRoom(){ Store.remove(`room/players/${pid}`); setView("lobby"); }

  function writeBet(nb){
    setMyBet(nb);
    const p = Math.max(-MAX_POS, Math.min(MAX_POS, nb.pos||0));
    Store.set(`room/bets/${RS.round}/${pid}`, { pos:p, dir: p>0?1:p<0?-1:0, size:Math.abs(p), bought:nb.bought, ts:Date.now() });
  }
  const classBuyInfo = () => {
    const me = RP[pid]; if(!me || me.busted || myBet.bought) return;
    const price = (RS.cfg&&RS.cfg.infoPrice)||cfg.infoPrice;
    if(me.capital <= price) return;
    writeBet({...myBet, bought:true});
  };

  // ---- host actions ----
  function hostStart(){
    const base = anyDb;
    const nR = Math.max(1, Math.min(cfg.roundsPerSession, base.length));
    const ids = shuffle(base.map(d=>d.id)).slice(0, nR);
    const cfgS = { infoFeature:cfg.infoFeature, infoPrice:cfg.infoPrice, revealMode:cfg.revealMode,
                   botsCanBuy:cfg.botsCanBuy, bots:{...cfg.bots} };
    const bc = {}; activeBots.forEach(b=>bc[b]=START_CAPITAL);
    Store.remove("room/bets"); Store.remove("room/results");
    Object.keys(RP).forEach(id2=>{
      Store.set(`room/players/${id2}/capital`, START_CAPITAL);
      Store.set(`room/players/${id2}/playing`, true);
      Store.set(`room/players/${id2}/busted`, false);
    });
    Store.set("room/state", { phase:"betting", round:0, total:nR, dateIds:ids, cfg:cfgS,
      botCaps:bc, saved:false, turnEndsAt: now() + (cfg.turnSeconds||60)*1000, startedAt: now() });
  }

  function hostSettle(){
    if(!RS || RS.phase!=="betting" || settlingRef.current) return;
    settlingRef.current = true;
    try{
      const d = dayById(RS.dateIds[RS.round]);
      const r = d.kospi_return;
      const bets = RB[RS.round]||{};
      const cfgS = RS.cfg||cfg;
      const players = {};
      Object.entries(RP).forEach(([id2,p])=>{
        if(!p.playing || p.busted) return;
        const b = bets[id2]||{};
        const bdir = (b.dir===1||b.dir===-1)? b.dir : 0;
        const bsize = Math.min(MAX_POS, Math.abs(b.size||0));
        const fee = (cfgS.infoFeature && b.bought)? cfgS.infoPrice : 0;
        const betAmt = Math.max(0,(p.capital-fee)) * (bdir===0?0:bsize)/100;
        const pnl = bdir*betAmt*r - fee;
        let capN = Math.max(0, p.capital + pnl);
        const busted = capN < RUIN_FLOOR;
        players[id2] = { name:p.name, dir:bdir, size:bdir===0?0:bsize, bought:!!(cfgS.infoFeature&&b.bought), pnl, capital:capN, busted };
        Store.set(`room/players/${id2}/capital`, capN);
        if(busted) Store.set(`room/players/${id2}/busted`, true);
      });
      const bots = {}; const nb = {...(RS.botCaps||{})};
      Object.keys(nb).forEach(b=>{
        const bd = d.bots[b];
        const buys = cfgS.infoFeature && cfgS.botsCanBuy && bd.informed.buy && nb[b] > cfgS.infoPrice;
        const dec = buys ? bd.informed : bd.base;
        const fee = buys ? cfgS.infoPrice : 0;
        const bbet = (nb[b]-fee) * dec.size/100;
        const bpnl = dec.dir*bbet*r - fee;
        nb[b] += bpnl;
        bots[b] = { dir:dec.dir, size:dec.size, rationale:dec.rationale, buys, pnl:bpnl, capital:nb[b] };
      });
      Store.set(`room/results/${RS.round}`, { r, dateId:RS.dateIds[RS.round], players, bots });
      Store.set("room/state", { ...RS, phase:"reveal", botCaps:nb, turnEndsAt:null,
        revealEndsAt: now() + (cfg.revealSeconds||5)*1000 });
    } finally { setTimeout(()=>{ settlingRef.current=false; }, 1500); }
  }

  function hostNext(){
    if(!RS || RS.phase!=="reveal" || advRef.current) return;
    advRef.current = true;
    Store.set("room/state", { ...RS, round:RS.round+1, phase:"betting", revealEndsAt:null,
      turnEndsAt: now() + (cfg.turnSeconds||60)*1000 });
    setTimeout(()=>{ advRef.current = false; }, 1500);
  }

  function hostEnd(){
    if(!RS || RS.saved) { Store.set("room/state", {...RS, phase:"finished"}); return; }
    Object.values(RP).forEach(p=>{

        ret:(p.capital-START_CAPITAL)/START_CAPITAL, rounds:(RS.round||0)+1, ts:Date.now() });
    });
    Store.set("room/state", { ...RS, phase:"finished", saved:true, turnEndsAt:null });
  }

      const act = Object.entries(RP).filter(([,p])=>p.playing && !p.busted);
      const bets = RB[RS.round]||{};
      const allIn = act.length>0 && act.every(([id2])=>{ const b=bets[id2]; return b && (b.pos!=null || b.dir!=null); });
      if(allIn){
        if(!allInRef.current) allInRef.current = now();
        else if(now() - allInRef.current > 1500) hostSettle();
      } else allInRef.current = null;
    } else {
      allInRef.current = null;
      if(RS.phase==="reveal" && RS.revealEndsAt && now() > RS.revealEndsAt && (RS.round+1) < RS.total) hostNext();

    setSc(snapshot);
    setDays(shuffle(base).slice(0, n));
    setI(0); setCap(START_CAPITAL); setNRounds(0);
    const bc={}; activeBots.forEach(b=>bc[b]=START_CAPITAL);
    setBotCaps(bc);
    setBought(false); setPos(0); setRes(null);
    setView("play");
  }
  const day = days[i];
  function soloBuy(){ if(bought || cap < sc.infoPrice) return; setCap(c=>c-sc.infoPrice); setBought(true); }
  function soloSettle(pDir, pSize){
    const r = day.kospi_return;
    const bet = cap * pSize/100;
    const pnl = pDir * bet * r;
    const bres = {}; const nb = {...botCaps};
    Object.keys(nb).forEach(b=>{
      const bd = day.bots[b];
      const buys = sc.infoFeature && sc.botsCanBuy && bd.informed.buy && nb[b] > sc.infoPrice;
      const dd = buys ? bd.informed : bd.base;
      const fee = buys ? sc.infoPrice : 0;
      const bbet = (nb[b]-fee) * dd.size/100;
      const bpnl = dd.dir*bbet*r - fee;
      nb[b] += bpnl;
      bres[b] = { dir:dd.dir, size:dd.size, rationale:dd.rationale, buys, pnl:bpnl, cap:nb[b] };
    });
    setBotCaps(nb); setCap(Math.max(0, cap+pnl)); setNRounds(n=>n+1);
    setRes({ r, pDir, pSize, bet, pnl, fee: bought? sc.infoPrice:0, bres });
    setView("result");
  }
  function soloNext(){
    if(i+1 >= days.length || cap < RUIN_FLOOR){ soloFinish(); return; }
    setI(x=>x+1); setBought(false); setPos(0); setRes(null);

    const cfgS = (RS&&RS.cfg)||cfg;
    const spect = me && !me.playing && (phase==="betting"||phase==="reveal");

    if(phase==="lobby" || !me || spect && phase!=="reveal" && false) {}
    if(phase==="lobby") return <div><TopBar/><DemoBanner/><SampleWarn/>
      <div className="wrap narrow fade">
        <div className="card">
          <h2 className="serif" style={{fontSize:24, fontWeight:900}}>{t.waitTitle}</h2>
          <p className="muted" style={{fontSize:13.5, marginTop:4}}>{t.waitSub}</p>
          <div className="kv">
            <div className="box"><div className="k">{t.kvCapital}</div><div className="v tnum">{KRW(START_CAPITAL)}</div></div>
            <div className="box"><div className="k">{t.kvRounds}</div><div className="v">{t.kvRoundsVal(Math.min(cfg.roundsPerSession, anyDb.length))}</div></div>
            <div className="box"><div className="k">{t.kvInfo}</div><div className="v">{cfg.infoFeature? t.kvInfoOn(KRW(cfg.infoPrice)) : t.kvInfoOff}</div></div>
            <div className="box"><div className="k">⏱</div><div className="v tnum">{(cfg.turnSeconds||60)}s / round</div></div>
          </div>
          <h3 className="mini">{t.waitBrief}</h3>
          <BriefingList/>
          <h3 className="mini">{t.playersHere(Object.keys(RP).length)}</h3>
          <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
            {Object.entries(RP).map(([id2,p])=><span key={id2} className="pill" style={id2===pid?{borderColor:"var(--ink)", color:"var(--ink)", fontWeight:700}:{}}>{p.name}</span>)}
          </div>
          <div style={{marginTop:16}}><button className="textbtn" onClick={leaveRoom}>{t.leave}</button></div>
        </div>
      </div></div>;

    if(spect) return <div><TopBar/>
      <div className="wrap narrow fade"><div className="card">
        <h2 className="serif" style={{fontSize:22, fontWeight:900}}>{t.waitTitle}</h2>
        <p className="muted" style={{fontSize:13.5, margin:"6px 0 14px"}}>{t.waitLate}</p>
        <h3 className="mini">{t.standings}</h3><Standings/>
      </div></div></div>;

    const d = RS && dayById(RS.dateIds[RS.round]);

    if(phase==="betting" && d){
      const remain = RS.turnEndsAt ? RS.turnEndsAt - now() : 0;
      const frac = RS.turnEndsAt ? Math.max(0, Math.min(1, remain / ((cfg.turnSeconds||60)*1000))) : 0;
      const mineBet = RB[RS.round]&&RB[RS.round][pid];
      const hasBet = !!(mineBet && (mineBet.pos!=null || mineBet.dir!=null));
      const price = cfgS.infoPrice;
      const dispCap = me.capital - (myBet.bought? price:0);
      const iAmOut = !!me.busted;
      const pos = myBet.pos||0, absPos = Math.abs(pos);
      return <div><TopBar/>
        <div className="wrap fade">
          <div className="card tight" style={{marginBottom:14, display:"flex", alignItems:"center", gap:14}}>
            <span className="progress">{t.round} {(RS.round||0)+1} / {RS.total}</span>
            <div style={{flex:1, height:8, background:"#e8e3d4", borderRadius:99, overflow:"hidden"}}>
              <div style={{width:(frac*100)+"%", height:"100%", background: remain<10000? "var(--up)":"var(--ink)", transition:"width .4s linear"}}></div>
            </div>
            <b className="tnum" style={{fontSize:16, color: remain<10000? "var(--up)":"var(--ink)"}}>
              {remain>0? mmss(remain) : t.settling}</b>
          </div>
          <div className="grid play">
            <div className="card">
              <div className="masthead">
                <div className="edition"><span>{t.edition}</span><span>{t.dateHidden}</span></div>
                <h2>{t.masthead}</h2>
                <div style={{fontSize:11.5, color:"var(--muted)"}}>{t.mastheadSub}</div>
              </div>
              <MarketStrip m={d.market}/>
              <Headlines items={d.headlines} />
              {cfgS.infoFeature && !iAmOut && <div>
                <div className="cutline"><span>{t.infoCut}</span></div>
                {!myBet.bought
                  ? <div>
                      <button className="btn ghost" disabled={me.capital <= price || remain<=0} onClick={classBuyInfo}>{t.buyInfo(KRW(price))}</button>
                      <p className="footer-note">{t.feeNote}</p>
                    </div>
                  : <div className="tomorrow">
                      <div className="thead">
                        <span>{t.tomorrow} <span className="muted" style={{fontWeight:400, fontSize:11}}>{cfgS.revealMode? t.revealTag : t.noisyTag}</span></span>
                        <span className="up" style={{fontSize:12, fontWeight:800}}>{t.paid(KRW(price))}</span>
                      </div>
                      <Headlines items={cfgS.revealMode? d.next_day_reveal : d.next_day_noisy} />
                    </div>}
              </div>}
            </div>
            <div style={{display:"grid", gap:14}}>
              {iAmOut
              ? <div className="card" style={{textAlign:"center"}}>
                  <div style={{fontSize:34}}>💀</div>
                  <h3 className="serif" style={{fontWeight:900, fontSize:18, margin:"6px 0"}}>{t.wiped}</h3>
                  <p className="muted" style={{fontSize:13}}>{t.wipedMsg}</p>
                </div>
              : <div className="card">
                <div style={{display:"flex", justifyContent:"space-between", marginBottom:14}}>
                  <span className="progress tnum">{t.capitalAvail} {KRW(dispCap)}</span>
                  {hasBet && <span className="progress" style={{color:"var(--accent)"}}>✓</span>}
                </div>
                <p className="step"><b>{t.stepPos}</b></p>
                <div style={{textAlign:"center", marginBottom:4}}>
                  <span className={pos>0?"up":pos<0?"down":"muted"} style={{fontWeight:900, fontSize:19}}>
                    {pos===0? t.posFlat : pos>0? t.posLong(absPos) : t.posShort(absPos)}
                  </span>
                  {absPos>100 && <span className="muted" style={{marginLeft:8, fontSize:12, fontWeight:700}}>{t.lev((absPos/100).toFixed(1))}</span>}
                </div>
                {absPos>0 && <div className="muted tnum" style={{textAlign:"center", fontSize:12}}>{KRW(dispCap*absPos/100)}</div>}
                <input type="range" min={-MAX_POS} max={MAX_POS} step="10" value={pos} disabled={remain<=0}
                  onChange={e=>setMyBet({...myBet, pos:+e.target.value})} />
                <div style={{display:"flex", justifyContent:"space-between", fontSize:10, color:"var(--muted)"}}>
                  <span>◀ {t.short} {MAX_POS}%</span><span>0</span><span>{t.long} {MAX_POS}% ▶</span>
                </div>
                <div className="muted" style={{fontSize:11.5, textAlign:"center", margin:"6px 0 14px"}}>
                  {absPos>0 ? t.varNote((absPos*VAR95*100).toFixed(1)) : t.varZero}
                </div>
                <p className="step"><b>{t.stepOrder}</b></p>
                <button className="btn" disabled={pos===0 || remain<=0} onClick={()=>writeBet({...myBet})}>{hasBet? t.resubmit : t.submit}</button>
                <div style={{textAlign:"center", marginTop:10}}>
                  <button className="textbtn" disabled={remain<=0} onClick={()=>writeBet({...myBet, pos:0})}>{t.pass}</button>
                </div>
                {hasBet && <p className="footer-note" style={{textAlign:"center"}}>{t.submitted}</p>}
              </div>}
              <div className="card tight">
                <h3 className="mini" style={{margin:"0 0 8px"}}>{t.standings}</h3>
                <Standings limit={7}/>
                {lang==="en" && <div className="muted" style={{fontSize:11, marginTop:6}}>{t.aiLangNote}</div>}
              </div>
            </div>
          </div>
        </div></div>;
    }

    if(phase==="reveal" && d){
      const result = RR[RS.round];
      const mine = result && result.players && result.players[pid];
      return <div><TopBar/>
        <div className="wrap fade">
          <div className="card hero">
            <div className="label">{t.resultLabel} · {t.round} {(RS.round||0)+1}/{RS.total}</div>
            <div className={"big "+cls(result? result.r:0)}>{result? pctf(result.r):"…"}</div>
            {mine && (mine.dir!==0
              ? <div className={"verdict "+((mine.dir*(result.r)>0)? "hit"+(mine.dir===-1?" short":"") : "miss")}>{(mine.dir*result.r>0)? t.hit : t.miss}</div>
              : <div className="verdict miss">{t.sat}</div>)}
            {mine && <div style={{marginTop:14, fontSize:14}}>
              {t.myChoice}: <b>{dirLabel(mine.dir)}</b>{mine.dir!==0 && <> · {mine.size}%</>}{mine.bought && <> · {t.infoFee} {KRW((RS.cfg||cfg).infoPrice)}</>}
            </div>}
            {mine && <div className={"tnum "+cls(mine.pnl-0.000001)} style={{fontSize:26, fontWeight:900, marginTop:2}}>{signKRW(mine.pnl)}</div>}
            {mine && <div className="muted tnum" style={{fontSize:13}}>{t.balance} {KRW(mine.capital)}</div>}
            {me.busted && !mine && <p style={{marginTop:12, fontWeight:800}}>{t.wiped}</p>}
            <p className="muted" style={{fontSize:12.5, marginTop:12}}>
              {RS.revealEndsAt && (RS.round+1)<RS.total && RS.revealEndsAt>now()
                ? t.nextIn(Math.max(0, Math.ceil((RS.revealEndsAt-now())/1000)))
                : t.waitNext}
            </p>
          </div>
          <div className="grid play" style={{marginTop:16, alignItems:"start"}}>
            <div className="card tight">
              <h3 className="mini" style={{margin:"0 0 8px"}}>{t.standings}</h3>
              <Standings/>
            </div>
            <div style={{display:"grid", gap:12}}>
              {result && Object.entries(result.bots||{}).map(([b,x])=>
                <div key={b} className="card tight">
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                    <span className={"badge "+BOT_META[b].cls}>{bName(b)}</span>
                    <b className={"tnum "+cls(x.pnl-0.000001)}>{signKRW(x.pnl)}</b>
                  </div>
                  <div style={{fontWeight:800, fontSize:14}}>{dirLabel(x.dir)}{x.dir!==0 && ` · ${x.size}%`}{x.buys && <span style={{marginLeft:6, fontWeight:600, fontSize:11.5, color:"#5b3aa6"}}>{t.infoBadge}</span>}</div>
                  <p className="muted" style={{fontSize:12.5, marginTop:6}}>“{x.rationale}”</p>
                </div>)}
            </div>
          </div>
        </div></div>;
    }

    if(phase==="finished"){
      return <div><TopBar/>
        <div className="wrap narrow fade"><div className="card">
          <h2 className="serif" style={{fontSize:24, fontWeight:900, marginBottom:4}}>{t.finalTitle}</h2>
          <p className="muted" style={{fontSize:13, marginBottom:14}}>{conn==="demo"? t.lbNoteDemo : t.lbNoteOn}</p>
          <h3 className="mini">{t.standings}</h3>
          <Standings/>
          <h3 className="mini">{t.lb}</h3>
          <Leaderboard rows={lb} limit={10}/>
          <button className="btn" style={{marginTop:18}} onClick={()=>setView("lobby")}>{t.again}</button>
        </div></div></div>;
    }

    return <div><TopBar/><div className="wrap"><p className="muted">{t.connecting}</p></div></div>;
  }

  /* ----- SOLO screens ----- */
  if(view==="play" && day) return <div><TopBar/>
    <div className="wrap fade">
      <div className="grid play">
        <div className="card">
          <div className="masthead">
            <div className="edition"><span>{t.edition}</span><span>{t.dateHidden}</span></div>
            <h2>{t.masthead}</h2>
            <div style={{fontSize:11.5, color:"var(--muted)"}}>{t.mastheadSub}</div>
          </div>
          <MarketStrip m={day.market}/>
          <Headlines items={day.headlines} />
          {sc.infoFeature && <div>
            <div className="cutline"><span>{t.infoCut}</span></div>
            {!bought
              ? <div>
                  <button className="btn ghost" disabled={cap < sc.infoPrice} onClick={soloBuy}>{t.buyInfo(KRW(sc.infoPrice))}</button>
                  <p className="footer-note">{t.feeNote}</p>
                </div>
              : <div className="tomorrow">
                  <div className="thead">
                    <span>{t.tomorrow} <span className="muted" style={{fontWeight:400, fontSize:11}}>{sc.revealMode? t.revealTag : t.noisyTag}</span></span>
                    <span className="up" style={{fontSize:12, fontWeight:800}}>{t.paid(KRW(sc.infoPrice))}</span>
                  </div>
                  <Headlines items={sc.revealMode? day.next_day_reveal : day.next_day_noisy} />
                </div>}
          </div>}
        </div>
        <div style={{display:"grid", gap:14}}>
          <div className="card">
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:14}}>
              <span className="progress">{t.round} {i+1} / {days.length}</span>
              <span className="progress tnum">{t.capitalAvail} {KRW(cap)}</span>
            </div>
            <p className="step"><b>{t.stepPos}</b></p>
            <div style={{textAlign:"center", marginBottom:4}}>
              <span className={pos>0?"up":pos<0?"down":"muted"} style={{fontWeight:900, fontSize:19}}>
                {pos===0? t.posFlat : pos>0? t.posLong(Math.abs(pos)) : t.posShort(Math.abs(pos))}
              </span>
              {Math.abs(pos)>100 && <span className="muted" style={{marginLeft:8, fontSize:12, fontWeight:700}}>{t.lev((Math.abs(pos)/100).toFixed(1))}</span>}
            </div>
            {pos!==0 && <div className="muted tnum" style={{textAlign:"center", fontSize:12}}>{KRW(cap*Math.abs(pos)/100)}</div>}
            <input type="range" min={-MAX_POS} max={MAX_POS} step="10" value={pos} onChange={e=>setPos(+e.target.value)} />
            <div style={{display:"flex", justifyContent:"space-between", fontSize:10, color:"var(--muted)"}}>
              <span>◀ {t.short} {MAX_POS}%</span><span>0</span><span>{t.long} {MAX_POS}% ▶</span>
            </div>
            <div className="muted" style={{fontSize:11.5, textAlign:"center", margin:"6px 0 14px"}}>
              {pos!==0 ? t.varNote((Math.abs(pos)*VAR95*100).toFixed(1)) : t.varZero}
            </div>
            <p className="step"><b>{t.stepOrder}</b></p>
            <button className="btn" disabled={pos===0} onClick={()=>soloSettle(pos>0?1:-1, Math.abs(pos))}>{t.submit}</button>
            <div style={{textAlign:"center", marginTop:10}}>
              <button className="textbtn" onClick={()=>soloSettle(0,0)}>{t.pass}</button>
            </div>
          </div>
        </div>
      </div>
    </div></div>;

  if(view==="result" && res && day){
    const hit = res.pDir!==0 && res.pDir*res.r>0;
    return <div><TopBar/>
      <div className="wrap fade">
        <div className="card hero">
          <div className="label">{t.resultLabel}</div>
          <div className={"big "+cls(res.r)}>{pctf(res.r)}</div>
          {res.pDir!==0
            ? <div className={"verdict "+(hit? "hit"+(res.pDir===-1?" short":"") : "miss")}>{hit? t.hit : t.miss}</div>
            : <div className="verdict miss">{t.sat}</div>}
          <div style={{marginTop:14, fontSize:14}}>
            {t.myChoice}: <b>{dirLabel(res.pDir)}</b>{res.pDir!==0 && <> · {res.pSize}% ({KRW(res.bet)})</>}{res.fee>0 && <> · {t.infoFee} {KRW(res.fee)}</>}
          </div>
          <div className={"tnum "+cls(res.pnl - 0.000001)} style={{fontSize:26, fontWeight:900, marginTop:2}}>{signKRW(res.pnl)}</div>
          <div className="muted tnum" style={{fontSize:13}}>{t.balance} {KRW(cap)}</div>
        </div>
        {Object.keys(res.bres).length>0 && <div className="grid bots" style={{marginTop:16}}>
          {Object.keys(res.bres).map(b=>{ const x=res.bres[b]; return (
            <div key={b} className="card tight">
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                <span className={"badge "+BOT_META[b].cls}>{bName(b)}</span>
                <b className={"tnum "+cls(x.pnl-0.000001)}>{signKRW(x.pnl)}</b>
              </div>
              <div style={{fontWeight:800, fontSize:14}}>{dirLabel(x.dir)}{x.dir!==0 && ` · ${x.size}%`}{x.buys && <span style={{marginLeft:6, fontWeight:600, fontSize:11.5, color:"#5b3aa6"}}>{t.infoBadge}</span>}</div>
              <p className="muted" style={{fontSize:12.5, marginTop:6}}>“{x.rationale}”</p>
              <div className="muted tnum" style={{fontSize:11.5, marginTop:8}}>{t.balance} {KRW(x.cap)}</div>
            </div>);})}
        </div>}
        <button className="btn" style={{marginTop:18}} onClick={soloNext}>
          {(i+1>=days.length || cap<=0)? t.finalBtn : t.next}
        </button>
      </div></div>;
  }

  if(view==="final"){
    const rows = [{name:name.trim()+" "+t.me, cap2:cap}, ...Object.keys(botCaps).map(b=>({name:bName(b), cap2:botCaps[b]}))]
      .sort((a,b)=>b.cap2-a.cap2);
    return <div><TopBar/>
      <div className="wrap narrow fade">
        <div className="card">
          <h2 className="serif" style={{fontSize:24, fontWeight:900, marginBottom:4}}>{t.finalTitle}</h2>
          <p className="muted" style={{fontSize:13, marginBottom:14}}>{cap<RUIN_FLOOR? t.busted : t.completed(nRounds)}</p>
          <table>
            <thead><tr><th>{t.thRank}</th><th>{t.thPlayer}</th><th className="r">{t.thCap}</th><th className="r">{t.thRet}</th></tr></thead>
            <tbody>{rows.map((e,k)=>
              <tr key={k} className={e.name.endsWith(t.me)? "me":""}>
                <td className="tnum">{k+1}</td><td>{e.name}</td>
                <td className="r tnum"><b>{KRW(e.cap2)}</b></td>
                <td className={"r tnum "+cls(e.cap2-START_CAPITAL)}>{pctf((e.cap2-START_CAPITAL)/START_CAPITAL)}</td>
              </tr>)}
            </tbody>
          </table>
          <p className="footer-note">{conn==="demo"? t.lbNoteDemo : t.lbNoteOn}</p>
          <h3 className="mini">{t.lb}</h3>
          <Leaderboard rows={lb} limit={15} />
          <button className="btn" style={{marginTop:18}} onClick={()=>setView("lobby")}>{t.again}</button>
        </div>
      </div></div>;
  }

  return <div><TopBar/><div className="wrap"><p className="muted">{t.connecting}</p></div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
